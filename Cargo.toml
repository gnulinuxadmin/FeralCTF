[package]
name = "feralctf"
version = "0.1.0"
edition = "2024"
authors = ["CyberSquirrels CTF Team"]
description = "High-performance self-hosted CTF platform. Single binary, SQLite, minimal resources."
license = "Apache-2.0"
repository = "https://github.com/gnulinuxadmin/FeralCTF"

[[bin]]
name = "feralctf"
path = "src/main.rs"

[dependencies]

# --- web framework ---
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "cors",
    "compression-gzip",
    "set-header",
    "trace",
    "fs",
] }

# --- async runtime ---
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "fs",
] }

# --- database ---
# rusqlite 0.32 with bundled sqlite and FromRow trait
rusqlite = { version = "0.32", features = ["bundled", "trace"] }
# Replace r2d2 with async-rx for connection pooling
async-rx = "0.1"

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# --- auth / crypto ---
argon2 = "0.5"
jsonwebtoken = "10"
sha2 = "0.10"
rand = "0.9"

# --- cache ---
dashmap = "6"

# --- asset embedding ---
rust-embed = { version = "8", features = ["compression"] }

# --- logging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- file handling ---
zip = "8"
mime_guess = "2"

# --- utilities ---
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"

# --- async traits and channels ---
async-trait = "0.1"
async-channel = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true        # strip debug symbols — keeps binary small
panic = "abort"     # smaller binary, no unwinding overhead

[profile.dev]
opt-level = 0
debug = true