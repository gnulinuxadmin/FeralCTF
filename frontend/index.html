<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeralCTF - Capture The Flag</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">FeralCTF</div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#challenges">Challenges</a></li>
                <li><a href="#scoreboard">Scoreboard</a></li>
                <li><a href="#login">Login</a></li>
                <li><a href="#register">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home">
            <h1>Welcome to FeralCTF</h1>
            <p>Capture The Flag competition platform</p>
        </section>

        <section id="challenges">
            <h2>Challenges</h2>
            <div class="challenge-grid">
                <!-- Challenge cards will be populated by JavaScript -->
            </div>
        </section>

        <section id="scoreboard">
            <h2>Scoreboard</h2>
            <div class="scoreboard-container">
                <!-- Scoreboard entries will be populated by JavaScript -->
            </div>
        </section>

        <section id="login">
            <h2>Login</h2>
            <form id="login-form">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </section>

        <section id="register">
            <h2>Register</h2>
            <form id="register-form">
                <input type="text" id="reg-username" placeholder="Username" required>
                <input type="email" id="reg-email" placeholder="Email" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <button type="submit">Register</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 FeralCTF. All rights reserved.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
